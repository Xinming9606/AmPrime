name: primer-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  # pipeline runner
  - snakemake-minimal>=8

  # taxid resolution + gene extraction
  - python=3.11
  - biopython
  - primer3-py

  # genome download
  - ncbi-genome-download

  # sequence tools
  - vsearch
  - muscle=5
  - seqkit

  # R + reporting
  - r-base>=4.3
  - r-seqinr
  - r-zoo
  - r-knitr
  - r-rmarkdown
  - r-kableextra
  - pandoc
