name: amprime
# Legacy micromamba/conda fallback. Keep this file in sync with the default
# Pixi environment; `pixi run metadata-check` enforces the mirrored fields.
channels:
  - conda-forge
  - bioconda
dependencies:
  # pipeline runner
  - snakemake-minimal>=8

  # cross-platform Python workflow implementation
  - python=3.12
  - biopython
  - numpy
  - matplotlib-base
  - pyyaml

  # genome download
  - ncbi-genome-download

  # reporting
  - markdown

  # development checks
  - ruff
  - pyrefly=1.2

  # Optional alignment backends are intentionally not installed by default.
  # Set alignment_backend: mafft/muscle/auto only after installing that aligner
  # separately on your platform.
