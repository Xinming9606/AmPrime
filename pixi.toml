[workspace]
name = "amprime"
version = "0.1.0"
description = "Amplicon-sequencing primer design workflow for bacterial genera"
authors = ["AmPrime contributors"]
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-arm64", "win-64"]
preview = ["pixi-build"]

[dependencies]
# Default dependencies are intentionally cross-platform across Linux,
# Apple Silicon macOS, and Windows. Optional alignment backends such as
# MAFFT/MUSCLE can be installed separately and selected with alignment_backend.
python = "3.12.*"
snakemake-minimal = ">=8"
biopython = "*"
numpy = "*"
matplotlib-base = "*"
pyyaml = "*"
ncbi-genome-download = "*"
markdown = "*"
ruff = "*"

[tasks]
compile = "python tools/compile_project.py"
metadata-check = "python tools/check_metadata.py"
lint = "ruff check workflow/scripts tools amprime"
format-check = "ruff format --check workflow/scripts tools amprime"
smoke = "python tools/smoke_project.py"
dry-run = "snakemake -n"
pipeline = "snakemake --cores 4"
ci = { depends-on = [
  "compile",
  "metadata-check",
  "lint",
  "format-check",
  "smoke",
  "dry-run"
] }
functional-test = "python -m amprime functional-test"
source-archive = "python tools/package_release.py"
conda-build = "pixi publish --path . --target-dir dist/conda --force"
conda-install-test = "python tools/test_built_package.py"

[package]
name = "amprime"
version = "0.1.0"
publish = true

[package.build]
backend = { name = "pixi-build-python", version = "0.*" }

[package.build.config]
extra-input-globs = [
  "amprime/**/*.py",
  "config/**/*",
  "workflow/**/*",
  "Snakefile",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[package.host-dependencies]
hatchling = "*"
python = "3.12.*"

[package.run-dependencies]
python = ">=3.12,<3.13"
snakemake-minimal = ">=8"
biopython = "*"
numpy = "*"
matplotlib-base = "*"
pyyaml = "*"
ncbi-genome-download = "*"
markdown = "*"
