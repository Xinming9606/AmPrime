[project]
name = "amprime"
version = "0.1.0"
description = "Amplicon-sequencing primer design workflow for bacterial genera"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "AmPrime contributors" },
]
# Runtime dependencies are declared in pixi.toml because AmPrime is distributed
# as a Pixi-built conda package. Keep this wheel metadata minimal to avoid a
# second dependency source of truth with PyPI-only package names.

[project.urls]
Homepage = "https://github.com/Xinming9606/AmPrime"
Issues = "https://github.com/Xinming9606/AmPrime/issues"
Repository = "https://github.com/Xinming9606/AmPrime"

[project.scripts]
amprime = "amprime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amprime"]

[tool.hatch.build.targets.wheel.force-include]
config = "amprime/config"
workflow = "amprime/workflow"
Snakefile = "amprime/Snakefile"

[tool.ruff]
fix = true
target-version = "py312"
line-length = 88
extend-exclude = [
  ".git",
  ".pixi",
  ".snakemake",
  "dist",
  "results",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 60
line-ending = "lf"
skip-magic-trailing-comma = true

[tool.ruff.lint]
extend-select = [
  "E",
  "W",
  "F",
  "B",
  "C4",
  "EM",
  "FA",
  "G",
  "INT",
  "PIE",
  "PT",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "SLOT",
  "T10",
  "YTT",
  "DTZ",
  "I",
  "ISC",
  "PERF",
  "RUF",
  "S",
  "SIM",
  "TID",
  "UP"
]
fixable = ["ALL"]
ignore = [
  "EM101",
  "EM102",
  "ISC001",
  "E501",
  "RUF001",
  "RUF002",
  "RUF003",
  "S101"
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
force-wrap-aliases = true
order-by-type = true
