[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "amprime"
version = "0.1.0"
description = "Amplicon-sequencing primer design workflow for bacterial genera"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "AmPrime contributors" },
]
dependencies = [
  "biopython",
  "markdown",
  "matplotlib",
  "ncbi-genome-download",
  "numpy",
  "pyyaml",
  "snakemake",
]

[project.scripts]
amprime = "amprime.cli:main"

[project.urls]
Homepage = "https://github.com/Xinming9606/AmPrime"
Repository = "https://github.com/Xinming9606/AmPrime"
Issues = "https://github.com/Xinming9606/AmPrime/issues"

[tool.hatch.build.targets.wheel]
packages = ["amprime"]

[tool.hatch.build.targets.wheel.force-include]
config = "amprime/config"
workflow = "amprime/workflow"
Snakefile = "amprime/Snakefile"
