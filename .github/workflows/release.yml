name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Compile and smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Cache CI test dataset
        id: test-data-cache
        uses: actions/cache@v4
        with:
          path: data/borrelia-genomes.tar.gz
          key: amprime-borrelia-genomes-${{ runner.os }}-${{ hashFiles('config/config.yaml', 'workflow/Snakefile', 'tools/download_test_dataset.py', 'workflow/scripts/genomes_download.py', 'workflow/scripts/gene_extract.py') }}

      - name: Download CI test dataset
        if: steps.test-data-cache.outputs.cache-hit != 'true'
        run: pixi run download-ci-test-data

      - name: Run project checks
        run: pixi run ci

  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build source archives
        run: pixi run source-archive

      - name: Build conda package
        run: pixi run conda-build

      - name: Test built package install
        run: pixi run conda-install-test

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amprime-release-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/conda/*.conda

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip
          dist/*.tar.gz
          dist/conda/*.conda
          --generate-notes
          --verify-tag
