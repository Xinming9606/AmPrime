name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Compile and smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Run project checks
        run: pixi run ci

      - name: Test built package install
        run: pixi run conda-install-test

  release:
    name: Build and publish release artifacts
    runs-on: ubuntu-latest
    needs: check

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Build source archives
        run: pixi run source-archive

      - name: Build conda package
        run: pixi run conda-build

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amprime-release-artifacts
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/conda/*.conda

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*.zip
          dist/*.tar.gz
          dist/conda/*.conda
          --generate-notes
          --verify-tag
