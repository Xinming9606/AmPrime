name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Compile and smoke test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          cache: true

      - name: Cache CI test dataset
        id: test-data-cache
        uses: actions/cache@v4
        with:
          path: data/borrelia-genomes.tar.gz
          key: amprime-borrelia-genomes-${{ runner.os }}-${{ hashFiles('config/config.yaml', 'tools/download_test_dataset.py', 'workflow/scripts/download_genomes.py') }}

      - name: Download CI test dataset
        if: steps.test-data-cache.outputs.cache-hit != 'true'
        run: pixi run download-ci-test-data

      - name: Run project checks
        run: pixi run ci
